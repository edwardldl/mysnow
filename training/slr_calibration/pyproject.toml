[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mysnow-slr-calibration"
version = "0.1.0"
description = "Deterministic offline hierarchical SLR residual calibration"
requires-python = ">=3.11"
dependencies = [
  "h3==4.3.1",
  "pyarrow==25.0.1",
]

# NOAA HRRR GRIB2 extraction prototype (slr_calibration.noaa_hrrr):
# ecCodes does the decoding; Herbie/cfgrib are installed alongside for
# ad-hoc retrieval and cross-checks. Verified installable on Python 3.14.
[project.optional-dependencies]
noaa = [
  "eccodes==2.50.0",
  "cfgrib==0.9.15.1",
  "herbie-data==2026.9.2",
]

# Step-2 gold-only profile-feature model (slr_calibration.gold_model):
# scikit-learn RF/GBM benchmark on screened direct labels.
ml = [
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
]

[project.scripts]
mysnow-slr-calibration = "slr_calibration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
